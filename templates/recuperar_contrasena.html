<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña - ITSE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        body::before { content: ''; position: fixed; inset: 0; background: url('/static/biblioteca.jpg') center/cover no-repeat; z-index: 0; }
        .box { position: relative; z-index: 2; background: white; padding: 36px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 340px; text-align: center; border-top: 6px solid #D4A12A; }
        h2 { color: #002B5C; font-size: 20px; margin-bottom: 6px; }
        .sub { font-size: 13px; color: #666; margin-bottom: 22px; line-height: 1.5; }
        .field { text-align: left; margin-bottom: 16px; }
        .field label { display: block; font-size: 13px; font-weight: bold; color: #333; margin-bottom: 5px; }
        .field label span { color: #e74c3c; }
        .input-wrap { display: flex; border: 1px solid #ccc; border-radius: 5px; overflow: hidden; }
        .input-wrap input { flex: 1; padding: 11px 12px; border: none; outline: none; font-size: 14px; font-family: inherit; }
        .input-wrap .icon { padding: 0 12px; background: #f5f5f5; border-left: 1px solid #ccc; display: flex; align-items: center; color: #888; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background: #002B5C; color: #D4A12A; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 4px; }
        .btn:hover { background: #001a38; }
        .mensaje { background: #e8f5e9; color: #1a5c22; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; border-left: 4px solid #27ae60; text-align: left; }
        .error { background: #fdecea; color: #c0392b; padding: 12px; border-radius: 6px; font-size: 13px; margin-bottom: 14px; border-left: 4px solid #e74c3c; }
        .volver { display: block; margin-top: 16px; font-size: 13px; color: #888; text-decoration: none; }
        .volver:hover { color: #002B5C; }
    </style>
</head>
<body>
    <div class="box">
        <img src="/static/Logo UNAM.png" alt="Logo UNAM" style="width:80px;height:80px;object-fit:contain;margin:0 auto 14px;display:block;">
        <h2>Recuperar Contraseña</h2>
        <p class="sub">Ingresa tu número de cuenta y te mostraremos tu contraseña actual.</p>

        {% if mensaje %}
            <div class="mensaje">{{ mensaje }}</div>
        {% endif %}
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="field">
                <label>Número de cuenta: <span>*</span></label>
                <div class="input-wrap">
                    <input type="text" name="cuenta" placeholder="Usuario" required autofocus>
                    <span class="icon">&#128100;</span>
                </div>
            </div>
            <button type="submit" class="btn">Recuperar</button>
        </form>

        <a href="/login" class="volver">← Volver al inicio de sesión</a>
    </div>
</body>
</html>
