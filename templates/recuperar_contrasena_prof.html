<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar contraseña - Docente ITSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root{ --auth-bg: url('/static/biblioteca.jpg'); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-box acento-verde">
            <img src="/static/Logo UNAM.png" alt="Logo UNAM" class="logo">
            <h2>Recuperar contraseña</h2>
            <p class="subt">Ingresa tu nombre de usuario y te generaremos una nueva contraseña temporal</p>

            {% if mensaje %}
                <div class="mensaje-ok">{{ mensaje }}</div>
            {% endif %}
            {% if error %}
                <div class="mensaje-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="campo">
                    <label>Usuario <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input type="text" name="usuario" placeholder="Usuario" required autofocus>
                        <span class="icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn verde">Recuperar contraseña</button>
            </form>

            <div class="auth-links">
                <a href="/profesor/login" class="volver">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</body>
</html>
