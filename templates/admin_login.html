<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrativo - ITSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root{ --auth-bg: url('/static/biblioteca.jpg'); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-box acento-verde">
            <img src="/static/Logo UNAM.png" alt="Logo UNAM" class="logo">
            <span class="auth-badge verde">Acceso administrativo</span>
            <h2>Facultad de Estudios Superiores Cuautitlán</h2>
            <p class="subt">Panel de administración del sistema</p>

            {% if error %}
                <div class="mensaje-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="campo">
                    <label>Usuario y/o cuenta UNAM <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input type="text" name="usuario" placeholder="Usuario" required autofocus>
                        <span class="icon" title="Capturar nombre de Usuario ó los 9 dígitos del No. de Cuenta UNAM">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
                        </span>
                    </div>
                </div>
                <div class="campo">
                    <label>Contraseña <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input type="password" name="password" id="pwd" placeholder="••••••••••" required>
                        <span class="icon" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'" title="Mostrar / Ocultar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn verde">Ingresar</button>
            </form>

            <div class="auth-links">
                <a href="/" class="volver">← Volver a la pantalla de inicio</a>
            </div>
        </div>
    </div>
</body>
</html>
