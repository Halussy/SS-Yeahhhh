{% macro badge_estilo(nombre) %}
<span class="badge-estilo badge-{{ nombre|estilo_clase }}">
    {% if nombre == 'Visual' %}
    <svg viewBox="0 0 20 10"><path d="M0,5 C2,1 4,1 6,5 C8,9 10,9 12,5 C14,1 16,1 18,5 L20,5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    {% elif nombre == 'Auditivo' %}
    <svg viewBox="0 0 20 10"><path d="M0,8 L3,2 L6,8 L9,2 L12,8 L15,2 L18,8 L20,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    {% elif nombre == 'Kinestésico' %}
    <svg viewBox="0 0 20 10"><path d="M0,8 L0,2 L5,2 L5,8 L10,8 L10,2 L15,2 L15,8 L20,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    {% else %}
    <svg viewBox="0 0 20 10"><path d="M0,9 L4,9 L4,6 L8,6 L8,4 L12,4 L12,2 L16,2 L16,1 L20,1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    {% endif %}
    {{ nombre }}
</span>
{% endmacro %}
