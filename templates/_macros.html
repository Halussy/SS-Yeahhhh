{% macro badge_estilo(nombre) %}
<span class="badge-estilo badge-{{ nombre|estilo_clase }}">
    {% if nombre == 'Visual' %}
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4,32 C13,16 24,9 32,9 C40,9 51,16 60,32 C51,48 40,55 32,55 C24,55 13,48 4,32 Z"/>
        <circle cx="32" cy="32" r="9"/>
    </svg>
    {% elif nombre == 'Auditivo' %}
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8,24 H18 L30,12 V52 L18,40 H8 Z"/>
        <path d="M40,20 C46,26 46,38 40,44"/>
        <path d="M46,12 C56,22 56,42 46,52"/>
    </svg>
    {% elif nombre == 'Kinestésico' %}
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <line x1="32" y1="6" x2="32" y2="58"/>
        <line x1="6" y1="32" x2="58" y2="32"/>
        <path d="M24,14 L32,6 L40,14"/>
        <path d="M24,50 L32,58 L40,50"/>
        <path d="M14,24 L6,32 L14,40"/>
        <path d="M50,24 L58,32 L50,40"/>
    </svg>
    {% else %}
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="14" y="8" width="36" height="48" rx="4"/>
        <path d="M21,20 L25,24 L33,16"/>
        <line x1="38" y1="20" x2="45" y2="20"/>
        <path d="M21,34 L25,38 L33,30"/>
        <line x1="38" y1="34" x2="45" y2="34"/>
        <path d="M21,48 L25,52 L33,44"/>
        <line x1="38" y1="48" x2="45" y2="48"/>
    </svg>
    {% endif %}
    {{ nombre }}
</span>
{% endmacro %}
