<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Profesores - ITSE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root{ --auth-bg: url('/static/biblioteca.jpg'); }
    </style>
</head>
<body>
    <div class="auth-shell">
        <div class="auth-box">
            <img src="/static/Logo UNAM.png" alt="Logo UNAM" class="logo">
            <span class="auth-badge">Portal Docente</span>
            <h2>Facultad de Estudios Superiores Cuautitlán</h2>
            <p class="subt">Acceso exclusivo para profesores</p>

            {% if error %}
                <div class="mensaje-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="campo">
                    <label>Usuario y/o cuenta UNAM <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input type="text" name="usuario" placeholder="Usuario" required autofocus>
                        <span class="icon" title="Capturar nombre de Usuario ó los 9 dígitos del No. de Cuenta UNAM">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
                        </span>
                    </div>
                </div>
                <div class="campo">
                    <label>Contraseña <span class="req">*</span></label>
                    <div class="input-wrap">
                        <input type="password" name="password" id="pwd" placeholder="••••••••••" required>
                        <span class="icon" onclick="togglePwd()" title="Mostrar / Ocultar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </span>
                    </div>
                    <p class="campo-ayuda">La contraseña es su fecha de nacimiento (ddmmaaaa)</p>
                </div>

                <div class="captcha-box">
                    <p>Por favor valide el CAPTCHA</p>
                    <div class="captcha-img-wrap">
                        <img id="captcha-img" src="/captcha" width="200" height="70" alt="CAPTCHA">
                        <button type="button" class="captcha-refresh" onclick="refrescarCaptcha()" title="Nuevo código">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
                        </button>
                    </div>
                    <input type="text" name="captcha_input" class="captcha-input" placeholder="Escribe el código" required autocomplete="off">
                </div>

                <button type="submit" class="btn dorado">Ingresar</button>
            </form>

            <div class="auth-links">
                <a href="/profesor/recuperar_contrasena">Recuperar contraseña</a>
                <a href="/" class="volver">← Volver a la pantalla de inicio</a>
            </div>
        </div>
    </div>

    <script>
        function togglePwd() {
            const f = document.getElementById('pwd');
            f.type = f.type === 'password' ? 'text' : 'password';
        }
        function refrescarCaptcha() {
            document.getElementById('captcha-img').src = '/captcha?' + Date.now();
        }
    </script>
</body>
</html>
